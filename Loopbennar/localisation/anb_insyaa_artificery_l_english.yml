 artifice_invention_reverse_mechanim.tt: "Gain the ability to build the Manufactory §YMechanim Automatory§!.\nAutomatories will spread up to §Y20§! §YMechanim Minorities§! in provinces you own every §Y10§! years, §Rdepleting the development§! of the province the building is based in.\n"

